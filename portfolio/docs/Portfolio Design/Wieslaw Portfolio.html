document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

        <\u002Fa>\n\n          <a data-reveal=\"\" href=\"/work/learnx\" style=\"grid-column:span 2; display:flex; flex-direction:column; background:rgba(22,27,34,0.78); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border:1px solid #1F2937; border-top:1px solid rgba(255,255,255,0.06); border-radius:20px; padding:28px; transition:border-color 200ms cubic-bezier(.2,.8,.2,1), box-shadow 200ms cubic-bezier(.2,.8,.2,1);\" style-hover=\"border-color:#A78BFA; box-shadow:0 0 24px rgba(124,58,237,0.20);\">\n            <div style=\"display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:24px;\">\n              <span style=\"font-family:'JetBrains Mono', monospace; font-size:0.6875rem; text-transform:uppercase; letter-spacing:0.12em; color:#C4B5FD; border:1px solid rgba(167,139,250,0.35); background:rgba(252,211,77,0.08); border-color:rgba(252,211,77,0.4); color:#FCD34D; border-radius:6px; padding:5px 10px;\">Education<\u002Fspan>\n              <span style=\"font-family:'JetBrains Mono', monospace; font-size:0.6875rem; text-transform:uppercase; letter-spacing:0.12em; color:#8B949E; border:1px solid #30363D; border-radius:6px; padding:5px 10px;\">Client<\u002Fspan>\n            <\u002Fdiv>\n            <h3 style=\"font-family:'Bricolage Grotesque', sans-serif; font-variation-settings:'wdth' 96; font-weight:600; font-size:1.5rem; line-height:1.15; color:#F0F6FC; margin:0 0 10px;\">learnx<\u002Fh3>\n            <p style=\"color:#C9D1D9; margin:0 0 20px; text-wrap:pretty;\">LMS with rich-text authoring: drag-and-drop curriculum building, tables, code blocks, inline media.<\u002Fp>\n            <ul style=\"list-style:none; margin:auto 0 20px; padding:0; display:flex; flex-wrap:wrap; gap:6px;\">\n              <li style=\"font-family:'JetBrains Mono', monospace; font-size:0.6875rem; color:#8B949E; border:1px solid #1F2937; border-radius:6px; padding:4px 9px;\">React<\u002Fli>\n              <li style=\"font-family:'JetBrains Mono', monospace; font-size:0.6875rem; color:#8B949E; border:1px solid #1F2937; border-radius:6px; padding:4px 9px;\">TipTap<\u002Fli>\n              <li style=\"font-family:'JetBrains Mono', monospace; font-size:0.6875rem; color:#8B949E; border:1px solid #1F2937; border-radius:6px; padding:4px 9px;\">dnd-kit<\u002Fli>\n              <li style=\"font-family:'JetBrains Mono', monospace; font-size:0.6875rem; color:#8B949E; border:1px solid #1F2937; border-radius:6px; padding:4px 9px;\">Zustand<\u002Fli>\n            <\u002Ful>\n            <span style=\"font-family:'JetBrains Mono', monospace; font-size:0.75rem; text-transform:uppercase; letter-spacing:0.12em; color:#8B949E; display:flex; align-items:center; gap:10px;\">Read <span aria-hidden=\"true\">→<\u002Fspan><\u002Fspan>\n          <\u002Fa>\n\n          <a data-reveal=\"\" href=\"/work/pr-pulse\" style=\"grid-column:span 3; display:flex; flex-direction:column; background:rgba(22,27,34,0.78); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border:1px solid #1F2937; border-top:1px solid rgba(255,255,255,0.06); border-radius:20px; padding:28px; transition:border-color 200ms cubic-bezier(.2,.8,.2,1), box-shadow 200ms cubic-bezier(.2,.8,.2,1);\" style-hover=\"border-color:#22D3EE; box-shadow:0 0 24px rgba(34,211,238,0.20);\">\n            <div style=\"display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:24px;\">\n              <span style=\"font-family:'JetBrains Mono', monospace; font-size:0.6875rem; text-transform:uppercase; letter-spacing:0.12em; color:#67E8F9; border:1px solid rgba(34,211,238,0.35); background:rgba(34,211,238,0.08); border-radius:6px; padding:5px 10px;\">Developer tooling<\u002Fspan>\n              <span style=\"font-family:'JetBrains Mono', monospace; font-size:0.6875rem; text-transform:uppercase; letter-spacing:0.12em; color:#8B949E; border:1px solid #30363D; border-radius:6px; padding:5px 10px;\">Public<\u002Fspan>\n            <\u002Fdiv>\n            <h3 style=\"font-family:'Bricolage Grotesque', sans-serif; font-variation-settings:'wdth' 96; font-weight:600; font-size:1.5rem; line-height:1.15; color:#F0F6FC; margin:0 0 10px;\">PR-Pulse<\u002Fh3>\n            <p style=\"color:#C9D1D9; margin:0 0 20px; max-width:48ch; text-wrap:pretty;\">Pull-request performance and review-signal tooling — where reviews stall, and who is carrying the load.<\u002Fp>\n            <ul style=\"list-style:none; margin:auto 0 20px; padding:0; display:flex; flex-wrap:wrap; gap:6px;\">\n              <li style=\"font-family:'JetBrains Mono', monospace; font-size:0.6875rem; color:#8B949E; border:1px solid #1F2937; border-radius:6px; padding:4px 9px;\">TypeScript<\u002Fli>\n              <li style=\"font-family:'JetBrains Mono', monospace; font-size:0.6875rem; color:#8B949E; border:1px solid #1F2937; border-radius:6px; padding:4px 9px;\">Next.js<\u002Fli>\n              <li style=\"font-family:'JetBrains Mono', monospace; font-size:0.6875rem; color:#8B949E; border:1px solid #1F2937; border-radius:6px; padding:4px 9px;\">Vercel Blob<\u002Fli>\n              <li style=\"font-family:'JetBrains Mono', monospace; font-size:0.6875rem; color:#8B949E; border:1px solid #1F2937; border-radius:6px; padding:4px 9px;\">Motion<\u002Fli>\n            <\u002Ful>\n            <span style=\"font-family:'JetBrains Mono', monospace; font-size:0.75rem; text-transform:uppercase; letter-spacing:0.12em; color:#8B949E; display:flex; align-items:center; gap:10px;\">Read <span aria-hidden=\"true\">→<\u002Fspan><\u002Fspan>\n          <\u002Fa>\n\n          <div data-reveal=\"\" aria-label=\"AR case study, in preparation\" style=\"grid-column:span 3; display:flex; flex-direction:column; background:rgba(17,22,29,0.62); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border:1px dashed #30363D; border-radius:20px; padding:28px;\">\n            <div style=\"display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:24px;\">\n              <span style=\"font-family:'JetBrains Mono', monospace; font-size:0.6875rem; text-transform:uppercase; letter-spacing:0.12em; color:#8B949E; border:1px dashed #30363D; border-radius:6px; padding:5px 10px;\">AR / XR<\u002Fspan>\n              <span style=\"font-family:'JetBrains Mono', monospace; font-size:0.6875rem; text-transform:uppercase; letter-spacing:0.12em; color:#D29922; border:1px solid rgba(210,153,34,0.35); background:rgba(210,153,34,0.08); border-radius:6px; padding:5px 10px;\">In preparation<\u002Fspan>\n            <\u002Fdiv>\n            <h3 style=\"font-family:'Bricolage Grotesque', sans-serif; font-variation-settings:'wdth' 96; font-weight:600; font-size:1.5rem; line-height:1.15; color:#8B949E; margin:0 0 10px; border-bottom:1px dotted #30363D; align-self:flex-start;\">[AR project name]<\u002Fh3>\n            <p style=\"color:#8B949E; margin:0 0 20px; max-width:48ch; text-wrap:pretty;\">The eighth domain. Card renders live the moment the case study is supplied — the domain count above reads {{ domainCount }} until then.<\u002Fp>\n            <div style=\"display:flex; flex-wrap:wrap; gap:6px; margin:auto 0 0;\">\n              <span style=\"width:72px; height:26px; border:1px dashed #1F2937; border-radius:6px;\"><\u002Fspan>\n              <span style=\"width:88px; height:26px; border:1px dashed #1F2937; border-radius:6px;\"><\u002Fspan>\n              <span style=\"width:64px; height:26px; border:1px dashed #1F2937; border-radius:6px;\"><\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"lead\" aria-labelledby=\"lead-h\" style=\"position:relative; border-top:1px solid #1F2937;\">\n      <div aria-hidden=\"true\" style=\"position:absolute; inset:0;\">\n        <div style=\"position:sticky; top:0; height:100vh; max-height:100%; width:100%; overflow:hidden;\">\n          <canvas data-f=\"orbit\" style=\"position:absolute; inset:0; width:100%; height:100%; display:block;\"><\u002Fcanvas>\n          <div style=\"position:absolute; inset:0; background:linear-gradient(180deg, rgba(13,17,23,0.92) 0%, rgba(13,17,23,0.72) 40%, rgba(13,17,23,0.94) 100%);\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"position:relative; max-width:1440px; margin:0 auto; padding:clamp(4rem, 10vw, 10rem) clamp(1rem, 4vw, 4rem);\">\n        <p style=\"font-family:'JetBrains Mono', monospace; font-size:0.75rem; text-transform:uppercase; letter-spacing:0.12em; color:#A78BFA; margin:0 0 16px;\">02 — How I work<\u002Fp>\n        <h2 id=\"lead-h\" style=\"font-family:'Bricolage Grotesque', sans-serif; font-variation-settings:'wdth' 95; font-weight:600; font-size:clamp(1.75rem, 1.3rem + 1.6vw, 2.75rem); line-height:1.15; letter-spacing:-0.015em; color:#F0F6FC; margin:0 0 16px; max-width:22ch;\">Tested, typed, and shipped with a rollback plan.<\u002Fh2>\n        <p style=\"color:#8B949E; margin:0 0 48px; max-width:68ch; text-wrap:pretty;\">Three habits that follow me into every codebase.<\u002Fp>\n\n        <div style=\"display:grid; grid-template-columns:repeat(3, 1fr); gap:24px; margin-bottom:64px;\">\n          <article data-reveal=\"\" style=\"background:rgba(22,27,34,0.80); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border:1px solid #1F2937; border-top:1px solid rgba(167,139,250,0.30); border-radius:20px; padding:32px;\">\n            <span style=\"font-family:'JetBrains Mono', monospace; font-size:0.6875rem; text-transform:uppercase; letter-spacing:0.12em; color:#A78BFA;\">Habit 01<\u002Fspan>\n            <h3 style=\"font-family:'Bricolage Grotesque', sans-serif; font-variation-settings:'wdth' 100; font-weight:600; font-size:1.375rem; line-height:1.25; color:#F0F6FC; margin:16px 0 20px;\">Tested by default<\u002Fh3>\n            <ul style=\"list-style:none; margin:0; padding:0; display:grid; gap:12px;\">\n              <li style=\"display:grid; grid-template-columns:14px 1fr; gap:12px; color:#C9D1D9; font-size:0.9375rem; line-height:1.6;\"><span aria-hidden=\"true\" style=\"color:#7C3AED; line-height:1.6;\">▸<\u002Fspan>TDD with JUnit and Mockito — the test written with the feature, not after it.<\u002Fli>\n              <li style=\"display:grid; grid-template-columns:14px 1fr; gap:12px; color:#C9D1D9; font-size:0.9375rem; line-height:1.6;\"><span aria-hidden=\"true\" style=\"color:#7C3AED; line-height:1.6;\">▸<\u002Fspan>Shift-left: integration tests run on every push, against the contract rather than the implementation.<\u002Fli>\n              <li style=\"display:grid; grid-template-columns:14px 1fr; gap:12px; color:#C9D1D9; font-size:0.9375rem; line-height:1.6;\"><span aria-hidden=\"true\" style=\"color:#7C3AED; line-height:1.6;\">▸<\u002Fspan>Honest error handling: failures surface with context instead of being swallowed.<\u002Fli>\n            <\u002Ful>\n          <\u002Farticle>\n          <article data-reveal=\"\" style=\"background:rgba(22,27,34,0.80); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border:1px solid #1F2937; border-top:1px solid rgba(240,171,252,0.30); border-radius:20px; padding:32px;\">\n            <span style=\"font-family:'JetBrains Mono', monospace; font-size:0.6875rem; text-transform:uppercase; letter-spacing:0.12em; color:#F0ABFC;\">Habit 02<\u002Fspan>\n            <h3 style=\"font-family:'Bricolage Grotesque', sans-serif; font-variation-settings:'wdth' 100; font-weight:600; font-size:1.375rem; line-height:1.25; color:#F0F6FC; margin:16px 0 20px;\">Architecture that stays legible<\u002Fh3>\n            <ul style=\"list-style:none; margin:0; padding:0; display:grid; gap:12px;\">\n              <li style=\"display:grid; grid-template-columns:14px 1fr; gap:12px; color:#C9D1D9; font-size:0.9375rem; line-height:1.6;\"><span aria-hidden=\"true\" style=\"color:#E879F9; line-height:1.6;\">▸<\u002Fspan>Typed backends — the contract lives in the code, not in a document nobody opens.<\u002Fli>\n              <li style=\"display:grid; grid-template-columns:14px 1fr; gap:12px; color:#C9D1D9; font-size:0.9375rem; line-height:1.6;\"><span aria-hidden=\"true\" style=\"color:#E879F9; line-height:1.6;\">▸<\u002Fspan>SOLID and the boring patterns — Factory, Strategy, Repository — over cleverness.<\u002Fli>\n              <li style=\"display:grid; grid-template-columns:14px 1fr; gap:12px; color:#C9D1D9; font-size:0.9375rem; line-height:1.6;\"><span aria-hidden=\"true\" style=\"color:#E879F9; line-height:1.6;\">▸<\u002Fspan>Migrations reversible by design — dry-run, apply, rollback — so no release is a one-way door.<\u002Fli>\n            <\u002Ful>\n          <\u002Farticle>\n          <article data-reveal=\"\" style=\"background:rgba(22,27,34,0.80); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border:1px solid #1F2937; border-top:1px solid rgba(34,211,238,0.30); border-radius:20px; padding:32px;\">\n            <span style=\"font-family:'JetBrains Mono', monospace; font-size:0.6875rem; text-transform:uppercase; letter-spacing:0.12em; color:#67E8F9;\">Habit 03<\u002Fspan>\n            <h3 style=\"font-family:'Bricolage Grotesque', sans-serif; font-variation-settings:'wdth' 100; font-weight:600; font-size:1.375rem; line-height:1.25; color:#F0F6FC; margin:16px 0 20px;\">Owned to production<\u002Fh3>\n            <ul style=\"list-style:none; margin:0; padding:0; display:grid; gap:12px;\">\n              <li style=\"display:grid; grid-template-columns:14px 1fr; gap:12px; color:#C9D1D9; font-size:0.9375rem; line-height:1.6;\"><span aria-hidden=\"true\" style=\"color:#22D3EE; line-height:1.6;\">▸<\u002Fspan>Docker, CI/CD and cloud deployments — Azure, AWS — treated as part of the feature, not a hand-off.<\u002Fli>\n              <li style=\"display:grid; grid-template-columns:14px 1fr; gap:12px; color:#C9D1D9; font-size:0.9375rem; line-height:1.6;\"><span aria-hidden=\"true\" style=\"color:#22D3EE; line-height:1.6;\">▸<\u002Fspan>Monitoring, alerting and disaster recovery rehearsed before launch, not after an incident.<\u002Fli>\n              <li style=\"display:grid; grid-template-columns:14px 1fr; gap:12px; color:#C9D1D9; font-size:0.9375rem; line-height:1.6;\"><span aria-hidden=\"true\" style=\"color:#22D3EE; line-height:1.6;\">▸<\u002Fspan>Handover documentation written while the context is still fresh.<\u002Fli>\n            <\u002Ful>\n          <\u002Farticle>\n        <\u002Fdiv>\n\n        <h3 style=\"font-family:'JetBrains Mono', monospace; font-size:0.75rem; text-transform:uppercase; letter-spacing:0.12em; color:#8B949E; margin:0 0 24px; font-weight:400;\">How I run a project<\u002Fh3>\n        <ol data-reveal=\"\" style=\"list-style:none; margin:0 0 64px; padding:0; display:grid; grid-template-columns:repeat(5, 1fr); gap:1px; background:#1F2937; border:1px solid #1F2937; border-radius:12px; overflow:hidden;\">\n          <li style=\"background:rgba(17,22,29,0.88); backdrop-filter:blur(12px); padding:24px;\"><div style=\"font-family:'JetBrains Mono', monospace; font-size:0.6875rem; color:#A78BFA; margin-bottom:12px;\">01<\u002Fdiv><div style=\"font-family:'Bricolage Grotesque', sans-serif; font-variation-settings:'wdth' 100; font-weight:600; font-size:1.0625rem; color:#F0F6FC; margin-bottom:8px;\">Discovery<\u002Fdiv><p style=\"margin:0; font-size:0.875rem; line-height:1.55; color:#8B949E;\">Constraints, users, and the one thing that must not break.<\u002Fp><\u002Fli>\n          <li style=\"background:rgba(17,22,29,0.88); backdrop-filter:blur(12px); padding:24px;\"><div style=\"font-family:'JetBrains Mono', monospace; font-size:0.6875rem; color:#C4B5FD; margin-bottom:12px;\">02<\u002Fdiv><div style=\"font-family:'Bricolage Grotesque', sans-serif; font-variation-settings:'wdth' 100; font-weight:600; font-size:1.0625rem; color:#F0F6FC; margin-bottom:8px;\">Architecture<\u002Fdiv><p style=\"margin:0; font-size:0.875rem; line-height:1.55; color:#8B949E;\">Data model, boundaries, migration strategy. Written before code.<\u002Fp><\u002Fli>\n          <li style=\"background:rgba(17,22,29,0.88); backdrop-filter:blur(12px); padding:24px;\"><div style=\"font-family:'JetBrains Mono', monospace; font-size:0.6875rem; color:#A78BFA; margin-bottom:12px;\">03<\u002Fdiv><div style=\"font-family:'Bricolage Grotesque', sans-serif; font-variation-settings:'wdth' 100; font-weight:600; font-size:1.0625rem; color:#F0F6FC; margin-bottom:8px;\">Delivery cadence<\u002Fdiv><p style=\"margin:0; font-size:0.875rem; line-height:1.55; color:#8B949E;\">Staged builds, weekly demo, review as the default unit of work.<\u002Fp><\u002Fli>\n          <li style=\"background:rgba(17,22,29,0.88); backdrop-filter:blur(12px); padding:24px;\"><div style=\"font-family:'JetBrains Mono', monospace; font-size:0.6875rem; color:#67E8F9; margin-bottom:12px;\">04<\u002Fdiv><div style=\"font-family:'Bricolage Grotesque', sans-serif; font-variation-settings:'wdth' 100; font-weight:600; font-size:1.0625rem; color:#F0F6FC; margin-bottom:8px;\">Launch<\u002Fdiv><p style=\"margin:0; font-size:0.875rem; line-height:1.55; color:#8B949E;\">Rollback rehearsed, logging in place, on-call agreed.<\u002Fp><\u002Fli>\n          <li style=\"background:rgba(17,22,29,0.88); backdrop-filter:blur(12px); padding:24px;\"><div style=\"font-family:'JetBrains Mono', monospace; font-size:0.6875rem; color:#22D3EE; margin-bottom:12px;\">05<\u002Fdiv><div style=\"font-family:'Bricolage Grotesque', sans-serif; font-variation-settings:'wdth' 100; font-weight:600; font-size:1.0625rem; color:#F0F6FC; margin-bottom:8px;\">Operate<\u002Fdiv><p style=\"margin:0; font-size:0.875rem; line-height:1.55; color:#8B949E;\">Monitored, measured, and handed over so it outlives me.<\u002Fp><\u002Fli>\n        <\u002Fol>\n\n        <figure data-reveal=\"\" style=\"margin:0; background:rgba(17,22,29,0.62); backdrop-filter:blur(12px); border:1px dashed #30363D; border-radius:20px; padding:48px; display:grid; grid-template-columns:1fr auto; gap:48px; align-items:center;
