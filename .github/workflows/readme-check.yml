name: README check

# The profile leans on free third-party widgets that die without notice.
# This catches a dead image or a bad merge before a visitor does.

on:
  pull_request:
    paths: [README.md, scripts/check-readme.mjs, .github/workflows/readme-check.yml]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: node scripts/check-readme.mjs
