name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The pnpm/Turborepo workspace root is `portfolio/`, one level below this repo's root
# (where this workflow file must live). Every `run` step below executes from `portfolio/`
# via this default; steps that are not `run` steps (e.g. actions/setup-node's cache) do
# not inherit it and set `working-directory`/`cache-dependency-path` explicitly instead.
defaults:
  run:
    working-directory: portfolio

jobs:
  verify:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: portfolio/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Report placeholder content (never fails the build)
        run: pnpm lint:content

  budgets:
    name: Build and budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: portfolio/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Enforce JS bundle budget
        run: pnpm --filter @repo/web size
      - name: Enforce Lighthouse budgets
        run: pnpm --filter @repo/web lighthouse

  e2e:
    name: E2E, accessibility and visual
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: portfolio/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @repo/web exec playwright install --with-deps chromium webkit
      - run: pnpm --filter @repo/web test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: portfolio/apps/web/playwright-report/
          retention-days: 7
